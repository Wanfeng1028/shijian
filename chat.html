<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI 对话 - 史鉴</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root {
      --shijian-ink: #0a0a0a;
      --shijian-muted: #737373;
      --shijian-line: #ebebeb;
      --shijian-paper: #ffffff;
      --shijian-card: #ffffff;
      --shijian-primary: #2563eb;
      --shijian-primary-soft: #eff6ff;
      --shijian-accent: #3b82f6;
      --shijian-ai: transparent;
      --shijian-user: #2563eb;
      --shijian-shadow: 0 1px 1px rgb(0 0 0/0.05);
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      color: #0a0a0a;
      background: #ffffff;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.43;
      min-height: 100vh;
      padding-bottom: 260px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shijian-topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #ffffff;
      border-bottom: 1px solid #ebebeb;
    }

    .shijian-topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      min-height: 64px;
      padding: 10px 20px;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 16px;
    }

    .shijian-brand {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 20px;
      letter-spacing: 0;
      color: #0a0a0a;
      white-space: nowrap;
    }

    .shijian-brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: inline-grid;
      place-items: center;
      color: #ffffff;
      background: #0a0a0a;
      box-shadow: none;
      font-size: 18px;
      letter-spacing: 0;
    }

    .shijian-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .shijian-nav a {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      padding: 0 12px;
      border-radius: 999px;
      color: #737373;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }

    .shijian-nav a:hover {
      color: #0a0a0a;
      background: #f7f7f7;
    }

    .shijian-nav a.is-active,
    .shijian-nav a[aria-current="page"] {
      color: #2563eb;
      background: #eff6ff;
    }

    .shijian-profile-btn,
    .shijian-evaluate-btn,
    .shijian-send,
    .shijian-upload-label,
    .shijian-task-tab,
    .shijian-chip,
    .shijian-modal-actions button {
      min-height: 44px;
      border: 1px solid var(--shijian-line);
      border-radius: 12px;
      background: #fff;
      color: var(--shijian-ink);
      padding: 0 14px;
      font-weight: 700;
      transition: 0.18s ease;
    }

    .shijian-profile-btn {
      color: #ffffff;
      background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
      border-color: transparent;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      transform: none;
    }

    .shijian-profile-btn:hover {
      background: linear-gradient(180deg, #3392ff 0%, #3b82f6 100%);
      transform: none;
    }

    .shijian-profile-btn:hover,
    .shijian-send:hover,
    .shijian-evaluate-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .shijian-main {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    .shijian-card {
      background: #ffffff;
      border: 1px solid #ebebeb;
      border-radius: 24px;
      box-shadow: 0 1px 1px rgb(0 0 0 / 0.05);
      padding: 18px;
      margin-bottom: 16px;
    }

    .shijian-section-title {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
      color: #0a0a0a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .shijian-section-title::before {
      content: "";
      width: 4px;
      height: 18px;
      border-radius: 999px;
      background: #2563eb;
      display: inline-block;
    }

    .shijian-page-title {
      margin: 0;
      font-size: 24px;
      line-height: 34px;
      font-weight: 600;
      color: #0a0a0a;
    }

    .shijian-task-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .shijian-task-tab {
      width: 100%;
      background: #ffffff;
      border: 1px solid #ebebeb;
      border-radius: 10px;
      color: #737373;
      font-size: 14px;
      font-weight: 500;
    }

    .shijian-task-tab:hover,
    .shijian-task-tab.is-active,
    .shijian-task-tab[aria-selected="true"] {
      color: #2563eb;
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .shijian-task-desc {
      margin: 12px 0 0;
      padding: 12px 14px;
      border-radius: 12px;
      color: #525252;
      background: #f7f7f7;
      border: 1px solid #ebebeb;
    }

    .shijian-context-row {
      display: grid;
      grid-template-columns: 0.8fr 1.7fr 1fr;
      gap: 12px;
    }

    .shijian-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .shijian-field label {
      font-size: 13px;
      color: var(--shijian-muted);
      font-weight: 700;
    }

    .shijian-control {
      width: 100%;
      min-height: 44px;
      border: 1px solid #ebebeb;
      border-radius: 12px;
      background: #ffffff;
      color: #0a0a0a;
      padding: 9px 12px;
      outline: none;
    }

    .shijian-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgb(59 130 246 / 0.18);
    }

    .shijian-messages {
      height: min(52vh, 520px);
      min-height: 360px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: #f7f7f7;
    }

    .shijian-message,
    .message {
      max-width: 86%;
      margin: 0 0 12px;
      padding: 12px 14px;
      border-radius: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      border: none;
    }

    .shijian-message--ai,
    .message.ai,
    .message.assistant {
      background: transparent;
      color: #0a0a0a;
      border-bottom-left-radius: 16px;
    }

    .shijian-message--user,
    .message.user {
      margin-left: auto;
      color: #0a0a0a;
      background: #ffffff;
      box-shadow: 0 1px 1px rgb(0 0 0 / 0.05);
      border-bottom-right-radius: 16px;
    }

    .shijian-scroll-target {
      height: 1px;
    }

    .shijian-quick-wrap {
      margin-top: 14px;
    }

    .shijian-quick-label {
      font-size: 13px;
      color: var(--shijian-muted);
      font-weight: 700;
      margin-bottom: 8px;
    }

    #shijian-quick-questions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .shijian-chip {
      padding: 0 12px;
      color: #525252;
      background: #ffffff;
      border: 1px solid #ebebeb;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
    }

    .shijian-chip:hover {
      border-color: #d4d4d4;
      background: #f7f7f7;
      color: #0a0a0a;
    }

    .shijian-evaluate-desc {
      margin: 0 0 12px;
      color: var(--shijian-muted);
    }

    .shijian-evaluate-btn {
      color: #2563eb;
      border-color: #93c5fd;
      background: #eff6ff;
    }
    .shijian-evaluate-btn:hover {
      background: #dbeafe;
    }

    #shijian-evaluate-result {
      margin-top: 12px;
      min-height: 44px;
      padding: 12px 14px;
      border: 1px solid #ebebeb;
      border-radius: 12px;
      background: #ffffff;
      color: #737373;
      white-space: pre-wrap;
    }

    .shijian-eval-item {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      margin: 3px 12px 3px 0;
      color: var(--shijian-ink);
    }

    .shijian-footer-note {
      max-width: 980px;
      margin: 0 auto 24px;
      padding: 0 20px;
      color: var(--shijian-muted);
      font-size: 12px;
      text-align: center;
    }

    #shijian-composer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      max-width: 980px;
      margin: 0 auto;
      padding: 10px 20px calc(12px + env(safe-area-inset-bottom));
      background: #ffffff;
      border-top: 1px solid #ebebeb;
      box-shadow: 0 -1px 0 rgb(0 0 0/0.02);
    }

    #shijian-status {
      min-height: 24px;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--shijian-muted);
    }

    .shijian-image-preview {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding: 8px;
      border: 1px solid var(--shijian-line);
      border-radius: 12px;
      background: #fff;
    }

    .shijian-image-preview img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--shijian-line);
    }

    .shijian-image-remove {
      min-height: 44px;
      border: 1px solid var(--shijian-line);
      border-radius: 12px;
      background: #fff;
      color: #dc2626;
      padding: 0 12px;
      font-weight: 700;
    }

    .shijian-doc-line {
      min-height: 24px;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--shijian-muted);
    }

    .shijian-doc-name {
      color: var(--shijian-primary);
      font-weight: 700;
      margin-left: 8px;
    }

    .shijian-composer-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .shijian-visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .shijian-upload-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 0 0 auto;
      white-space: nowrap;
      background: #ffffff;
      border: 1px solid #ebebeb;
      border-radius: 10px;
      color: #0a0a0a;
    }

    .shijian-upload-label:hover {
      border-color: #d4d4d4;
      background: #f7f7f7;
    }

    .shijian-upload-icon {
      display: inline-grid;
      place-items: center;
      width: 18px;
      height: 18px;
    }

    .shijian-upload-icon svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    #shijian-input {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 44px;
      max-height: 140px;
      resize: none;
      border: 1px solid #ebebeb;
      border-radius: 12px;
      background: #ffffff;
      color: #0a0a0a;
      padding: 10px 12px;
      outline: none;
    }

    #shijian-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgb(59 130 246 / 0.18);
    }

    .shijian-send {
      flex: 0 0 auto;
      color: #ffffff;
      background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
      border-color: transparent;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      transform: none;
    }

    .shijian-send:hover {
      background: linear-gradient(180deg, #3392ff 0%, #3b82f6 100%);
      transform: none;
    }

    .shijian-composer-hint {
      margin-top: 6px;
      font-size: 12px;
      color: var(--shijian-muted);
    }

    .shijian-modal[hidden] {
      display: none;
    }

    .shijian-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .shijian-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(3px);
    }

    .shijian-modal-dialog {
      position: relative;
      width: min(520px, 100%);
      max-height: min(86vh, 720px);
      overflow-y: auto;
      background: #ffffff;
      border-radius: 24px;
      border: 1px solid #ebebeb;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      padding: 22px;
    }

    .shijian-modal-close {
      position: absolute;
      right: 14px;
      top: 12px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      font-size: 24px;
      color: var(--shijian-muted);
    }

    .shijian-modal-title {
      margin: 0 40px 6px 0;
      color: #0a0a0a;
      font-size: 20px;
      line-height: 26px;
      font-weight: 600;
    }

    .shijian-modal-desc {
      margin: 0 0 16px;
      color: #737373;
      font-size: 13px;
      line-height: 18px;
    }

    .shijian-profile-form {
      display: grid;
      gap: 12px;
    }

    .shijian-profile-form textarea {
      min-height: 96px;
      resize: vertical;
    }

    .shijian-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }

    .shijian-modal-actions button[type="submit"] {
      color: #fff;
      background: var(--shijian-primary);
      border-color: var(--shijian-primary);
    }

    @media (max-width: 640px) {
      body {
        padding-bottom: 280px;
      }

      .shijian-topbar-inner {
        min-height: 60px;
        padding: 8px 12px;
        gap: 8px;
        flex-wrap: wrap;
      }

      .shijian-brand {
        font-size: 18px;
      }

      .shijian-brand-mark {
        width: 34px;
        height: 34px;
      }

      .shijian-nav {
        order: 3;
        width: 100%;
        overflow-x: auto;
        flex: 0 0 100%;
        padding-bottom: 2px;
      }

      .shijian-nav a {
        padding: 0 10px;
        font-size: 14px;
      }

      .shijian-profile-btn {
        margin-left: auto;
        padding: 0 10px;
        font-size: 13px;
      }

      .shijian-main {
        padding: 16px 12px 32px;
      }

      .shijian-card {
        padding: 14px;
        border-radius: 14px;
      }

      .shijian-page-title {
        font-size: 20px;
      }

      .shijian-task-tabs {
        grid-template-columns: 1fr;
      }

      .shijian-context-row {
        grid-template-columns: 1fr;
      }

      .shijian-messages {
        height: 52vh;
        min-height: 340px;
        padding: 12px;
      }

      .shijian-message,
      .message {
        max-width: 94%;
      }

      #shijian-quick-questions {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 4px;
        -webkit-mask-image: linear-gradient(to right, #000 82%, transparent 100%);
        mask-image: linear-gradient(to right, #000 82%, transparent 100%);
      }

      .shijian-chip {
        flex: 0 0 auto;
      }

      #shijian-composer {
        padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
      }

      .shijian-composer-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: stretch;
      }

      #shijian-input {
        grid-column: 1 / -1;
        grid-row: 1;
      }

      .shijian-upload-label {
        grid-row: 2;
        width: 100%;
      }

      .shijian-send {
        grid-row: 2;
        width: 100%;
      }

      .shijian-composer-hint {
        display: none;
      }

      .shijian-footer-note {
        padding: 0 14px;
      }

      .shijian-modal {
        padding: 12px;
      }

      .shijian-modal-dialog {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <header class="shijian-topbar">
    <div class="shijian-topbar-inner">
      <a class="shijian-brand" href="index.html" aria-label="史鉴首页">
        <span class="shijian-brand-mark" aria-hidden="true">鉴</span>
        <span>史鉴</span>
      </a>
      <nav class="shijian-nav" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="chat.html" class="is-active" aria-current="page">AI 对话</a>
        <a href="records.html">学习记录</a>
      </nav>
      <button type="button" class="shijian-profile-btn" data-shijian-open-profile>我的学习档案</button>
    </div>
  </header>

  <div id="shijian-profile-modal" class="shijian-modal" hidden>
    <div class="shijian-modal-backdrop" data-shijian-close-profile></div>
    <div class="shijian-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="shijian-profile-title">
      <button type="button" class="shijian-modal-close" data-shijian-close-profile aria-label="关闭">×</button>
      <h2 id="shijian-profile-title" class="shijian-modal-title">我的学习档案</h2>
      <p class="shijian-modal-desc">完善档案后，史鉴会尽量按你的学习阶段与教材版本调整提问和解释方式。</p>
      <form id="shijian-profile-form" class="shijian-profile-form">
        <div class="shijian-field">
          <label for="shijian-profile-grade">年级</label>
          <select id="shijian-profile-grade" name="grade" class="shijian-control" required>
            <option value="">请选择</option>
            <option value="高一">高一</option>
            <option value="高二">高二</option>
            <option value="高三">高三</option>
          </select>
        </div>
        <div class="shijian-field">
          <label for="shijian-profile-semester">学期</label>
          <select id="shijian-profile-semester" name="semester" class="shijian-control" required>
            <option value="">请选择</option>
            <option value="上学期">上学期</option>
            <option value="下学期">下学期</option>
          </select>
        </div>
        <div class="shijian-field">
          <label for="shijian-profile-textbook">教材</label>
          <select id="shijian-profile-textbook" name="textbook" class="shijian-control" required>
            <option value="">请选择</option>
            <option value="《中外历史纲要（上）》">《中外历史纲要（上）》</option>
            <option value="《中外历史纲要（下）》">《中外历史纲要（下）》</option>
            <option value="选必一《国家制度与社会治理》">选必一《国家制度与社会治理》</option>
            <option value="选必二《经济与社会生活》">选必二《经济与社会生活》</option>
            <option value="选必三《文化交流与传播》">选必三《文化交流与传播》</option>
          </select>
        </div>
        <div class="shijian-field">
          <label for="shijian-profile-progress">学习进度或薄弱点</label>
          <textarea id="shijian-profile-progress" name="progress" class="shijian-control" rows="4" placeholder="如：近代史时间线容易混淆，史料题结论表达不够简洁"></textarea>
        </div>
        <div class="shijian-modal-actions">
          <button type="button" data-shijian-close-profile>取消</button>
          <button type="submit">保存档案</button>
        </div>
      </form>
    </div>
  </div>

  <main class="shijian-main">
    <section class="shijian-card" aria-labelledby="shijian-task-title">
      <h1 id="shijian-task-title" class="shijian-page-title">AI 教学对话</h1>
      <h2 class="shijian-section-title">任务切换</h2>
      <div class="shijian-task-tabs" role="tablist" aria-label="历史学习任务">
        <button type="button" class="shijian-task-tab is-active" data-task="reading" role="tab" aria-selected="true">史料阅读</button>
        <button type="button" class="shijian-task-tab" data-task="analysis" role="tab" aria-selected="false">史料辨析</button>
        <button type="button" class="shijian-task-tab" data-task="explanation" role="tab" aria-selected="false">历史解释</button>
      </div>
      <p id="shijian-task-desc" class="shijian-task-desc">按步骤引导提取史料关键信息、联系教材知识、生成巩固题。</p>
    </section>

    <section class="shijian-card" aria-labelledby="shijian-context-title">
      <h2 id="shijian-context-title" class="shijian-section-title">学习上下文</h2>
      <div class="shijian-context-row">
        <div class="shijian-field">
          <label for="shijian-grade">年级</label>
          <select id="shijian-grade" class="shijian-control">
            <option value="">未设置</option>
            <option value="高一">高一</option>
            <option value="高二">高二</option>
            <option value="高三">高三</option>
          </select>
        </div>
        <div class="shijian-field">
          <label for="shijian-textbook">教材</label>
          <select id="shijian-textbook" class="shijian-control">
            <option value="">未设置</option>
            <option value="《中外历史纲要（上）》">《中外历史纲要（上）》</option>
            <option value="《中外历史纲要（下）》">《中外历史纲要（下）》</option>
            <option value="选必一《国家制度与社会治理》">选必一《国家制度与社会治理》</option>
            <option value="选必二《经济与社会生活》">选必二《经济与社会生活》</option>
            <option value="选必三《文化交流与传播》">选必三《文化交流与传播》</option>
          </select>
        </div>
        <div class="shijian-field">
          <label for="shijian-topic">主题</label>
          <input id="shijian-topic" class="shijian-control" type="text" placeholder="如：鸦片战争">
        </div>
      </div>
    </section>

    <section class="shijian-card" aria-labelledby="shijian-chat-title">
      <h2 id="shijian-chat-title" class="shijian-section-title">对话探究</h2>
      <div id="shijian-messages" role="log" aria-live="polite" aria-label="史鉴对话消息">
        <div id="shijian-scroll-target" class="scroll-initial-target shijian-scroll-target" aria-hidden="true"></div>
      </div>

      <div class="shijian-quick-wrap">
        <div class="shijian-quick-label">快捷提问</div>
        <div id="shijian-quick-questions">
          <button type="button" class="shijian-chip" data-question="请按步骤提取这段史料的关键信息">请按步骤提取这段史料的关键信息</button>
          <button type="button" class="shijian-chip" data-question="这段史料和教材中的哪一知识点相关？">这段史料和教材中的哪一知识点相关？</button>
          <button type="button" class="shijian-chip" data-question="请根据史料生成3道巩固题">请根据史料生成3道巩固题</button>
        </div>
      </div>
    </section>

    <section id="shijian-evaluate" class="shijian-card" aria-labelledby="shijian-evaluate-title">
      <h2 id="shijian-evaluate-title" class="shijian-section-title">学习反馈评价</h2>
      <p class="shijian-evaluate-desc">完成一次探究后，点“生成评价”让史鉴按四个维度打分（1-5 分）。</p>
      <button type="button" id="shijian-evaluate-btn" class="shijian-evaluate-btn">生成评价</button>
      <div id="shijian-evaluate-result" aria-live="polite">暂无评价</div>
    </section>
  </main>

  <footer class="shijian-footer-note">
    史料原文、历史事实与 AI 推论会明确区分；史鉴不编造史料、人物原话、文献出处与历史数据。
  </footer>

  <form id="shijian-composer" autocomplete="off">
    <div id="shijian-status" aria-live="polite">准备就绪</div>

    <div id="shijian-image-preview" class="shijian-image-preview" hidden>
      <img id="shijian-image-preview-img" src="" alt="已选择图片预览">
      <button type="button" id="shijian-image-remove" class="shijian-image-remove" data-shijian-remove-image aria-label="移除图片">移除</button>
    </div>

    <div class="shijian-doc-line">
      文档：<span id="shijian-doc-name" class="shijian-doc-name" hidden></span>
    </div>

    <div class="shijian-composer-row">
      <input id="shijian-image-input" class="shijian-visually-hidden" type="file" accept="image/*">
      <input id="shijian-doc-input" class="shijian-visually-hidden" type="file" accept=".txt,.md,.pdf,.doc,.docx">

      <label for="shijian-image-input" class="shijian-upload-label" role="button">
        <span class="shijian-upload-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image" data-lucide="image">
  <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
  <circle cx="9" cy="9" r="2"/>
  <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
</svg>
        </span>
        图片
      </label>

      <label for="shijian-doc-input" class="shijian-upload-label" role="button">
        <span class="shijian-upload-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text" data-lucide="file-text">
  <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/>
  <path d="M14 2v5a1 1 0 0 0 1 1h5"/>
  <path d="M10 9H8"/>
  <path d="M16 13H8"/>
  <path d="M16 17H8"/>
</svg>
        </span>
        文档
      </label>

      <textarea id="shijian-input" rows="1" placeholder="输入你的观察或问题…" aria-label="输入你的观察或问题"></textarea>

      <button type="submit" id="shijian-send" class="shijian-send">发送</button>
    </div>

    <div class="shijian-composer-hint">
      Enter 发送，Shift + Enter 换行；纯文本文档可直接读取，PDF / Word 若无法读取正文，请复制粘贴文字。
    </div>
  </form>

  <script defer src="js/app.js"></script>
  <script defer src="js/chat.js"></script>
</body>
</html>
